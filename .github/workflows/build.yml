# Optional: build the engine on GitHub's Apple Silicon runners instead of your Mac.
# Free and unlimited only on PUBLIC repos (macOS minutes cost 10x on private ones).
# The runner has ~14 GB of disk, which is tight: ccache is disabled and sources are trimmed.
name: build-engine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /Applications/Xcode_*beta* ~/Library/Android /usr/local/share/dotnet || true
          df -h /
      - name: Homebrew deps
        run: brew install mingw-w64 bison flex ninja cmake pkgconf autoconf automake libtool llvm lld nasm freetype
      - name: Build
        env:
          NO_CCACHE: "1"
          MIN_FREE_GB: "10"
        run: ./build.sh
      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/logs/
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: dist/*.tar.xz*
